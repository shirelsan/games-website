<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maze Escape | GameZone</title>
    
    <link rel="stylesheet" href="css/style.css"> 
    <link rel="stylesheet" href="css/maze.css">  
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="login-overlay" id="loginOverlay">
        <div class="login-overlay-content">
            <h2>נדרשת כניסה</h2>
            <p>עליך להיות מחובר כדי לשחק את המשחק הזה</p>
            <a href="login.html" class="btn-login">התחברות</a>
        </div>
    </div>

    <header class="game-header-container">
        <div class="top-right-controls">
            <a href="index.html" class="btn-home">
                <i data-lucide="home"></i>חזרה לעמוד הבית</a>
        </div>

        <h1 class="game-title">הבריחה מהמבוך</h1>
        
        <p class="instructions">השתמשו בחיצים במקלדת כדי לזוז. איספו מטבעות והגיעו לדלת הירוקה!</p>
    </header>

    <main class="game-wrapper">        
        <div class="game-ui">
            <div class="score-board">
                <div class="stat">
                    <span>נקודות:</span>
                    <span id="score">0</span>
                </div>
                <div class="stat">
                    <span>רמה:</span>
                    <span id="levelDisplay">1</span>
                </div>
            </div>
            
            <div class="difficulty-selector" id="difficultyScreen">
                <h3>בחר רמת קושי:</h3>
                <div class="buttons-row">
                    <button class="diff-btn easy" onclick="startGame('easy')">קל</button>
                    <button class="diff-btn medium" onclick="startGame('medium')">בינוני</button>
                    <button class="diff-btn hard" onclick="startGame('hard')">קשה</button>
                </div>
            </div>

            <div class="game-controls" id="gameControls" style="display: none;">
                <button onclick="restartLevel()" class="control-btn">נסה שוב</button>
                <button onclick="quitGame()" class="control-btn danger">יציאה</button>
            </div>
        </div>

        <div id="gameContainer" class="game-container">
            <div id="player" class="player"></div>
            <div id="messageOverlay" class="overlay hidden">
                <h2 id="overlayTitle"></h2>
                <p id="overlayText"></p>
                <button id="overlayBtn" onclick="nextLevel()">המשך</button>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <p>© 2026 Fun&Games Website. All rights reserved</p>
        <div class="follow-us">
            <span>Follow us on</span>
            <div class="social-icons">
                <a href="#" target="_blank"><img src="images/instagram.png" alt="Instagram"></a>
                <a href="#" target="_blank"><img src="images/facebook.png" alt="Facebook"></a>
            </div>
        </div>
    </footer>

    <script>lucide.createIcons();</script>
    
    <script src="js/maze.js"></script> 
    <script>
        // בדיקת התחברות לפני הצגת המשחק
        document.addEventListener('DOMContentLoaded', () => {
            // שימוש ב-localStorage כדי להיות מסונכרן עם שאר המערכת
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            
            const loginOverlay = document.getElementById('loginOverlay');
            const gameContainer = document.getElementById('gameContainer');
            const gameWrapper = document.querySelector('.game-wrapper');
            
            if (!currentUser) {
                // לא מחובר: הסתרת המשחק והצגת הודעת התחברות
                if (gameWrapper) gameWrapper.style.display = 'none';
                if (loginOverlay) loginOverlay.style.display = 'flex';
            } else {
                // מחובר: הצגת המשחק
                if (gameWrapper) gameWrapper.style.display = 'flex';
                if (loginOverlay) loginOverlay.style.display = 'none';
            }
        });
    </script>
</body>
</html>
